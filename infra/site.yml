AWSTemplateFormatVersion: '2010-09-09'
Description: Site Nilo - S3 privado, CloudFront HTTPS e deploy GitHub OIDC

Parameters:
  GitHubRepository:
    Type: String
    Default: kwytechnologie/site-Nilo
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
  ExistingGitHubOidcProviderArn:
    Type: String
    Default: ''
    Description: ARN do provider token.actions.githubusercontent.com se ja existir nesta conta
  DomainName:
    Type: String
    Default: nilo.kwytech.com
  CertificateArn:
    Type: String
    Default: ''
    Description: Certificado ACM emitido em us-east-1 para DomainName; vazio usa o dominio CloudFront

Conditions:
  CreateGitHubOidcProvider: !Equals [!Ref ExistingGitHubOidcProviderArn, '']
  UseCustomDomain: !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-s3'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  DirectoryIndex:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-index'
      AutoPublish: true
      FunctionConfig:
        Comment: Resolve paginas estaticas em subdiretorios
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri.endsWith('/')) {
            request.uri += 'index.html';
          } else if (!request.uri.split('/').pop().includes('.')) {
            return {
              statusCode: 301,
              headers: { location: { value: request.uri + '/' } }
            };
          }
          return request;
        }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${AWS::StackName} - Nilo'
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        Aliases: !If [UseCustomDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        PriceClass: PriceClass_All
        Origins:
          - Id: s3
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          MinTTL: 0
          DefaultTTL: 300
          MaxTTL: 31536000
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: none
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt DirectoryIndex.FunctionARN
        ViewerCertificate:
          CloudFrontDefaultCertificate: !If [UseCustomDomain, !Ref 'AWS::NoValue', true]
          AcmCertificateArn: !If [UseCustomDomain, !Ref CertificateArn, !Ref 'AWS::NoValue']
          SslSupportMethod: !If [UseCustomDomain, sni-only, !Ref 'AWS::NoValue']
          MinimumProtocolVersion: !If [UseCustomDomain, TLSv1.2_2021, !Ref 'AWS::NoValue']

  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub '${SiteBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateGitHubOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateGitHubOidcProvider
                - !Ref GitHubOidcProvider
                - !Ref ExistingGitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:ref:refs/heads/main'
      Policies:
        - PolicyName: PublishSite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Effect: Allow
                Action:
                  - cloudfront:CreateInvalidation
                  - cloudfront:GetInvalidation
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  AWSRegion:
    Value: !Ref AWS::Region
  BucketName:
    Value: !Ref SiteBucket
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
  CloudFrontDistributionId:
    Value: !Ref Distribution
  SiteUrl:
    Value: !If [UseCustomDomain, !Sub 'https://${DomainName}', !Sub 'https://${Distribution.DomainName}']
  CloudFrontDomainName:
    Value: !GetAtt Distribution.DomainName
